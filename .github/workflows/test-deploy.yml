name: Deploy to test namespace

on:
  push:
    branches: [ test ]

env:
  TOOLS_NS: a6d989-tools
  TEST_NS:   a6d989-test

  # BuildConfig and Deployment name
  APP:      employee-information-database

  REGISTRY: ${{ secrets.REGISTRY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
        group: "test-deploy"
        cancel-in-progress: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "latest"

      - name: oc login
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}    # SA token

      - name: Start OpenShift build in the tools namespace
        run: |
          # --wait flag tells the client to stream the build log and block until the build completes. It exits with a non-zero status if the build fails.
          oc start-build $APP --wait -n $TOOLS_NS

      - name: Add custom tag to the newly created image in the tools namespace
        run: |
            # test-<first7charsOfCommit>
            TAG=test-${GITHUB_SHA::7}
            
            # latest -> test-<sha>-tools
            oc -n $TOOLS_NS tag $APP:latest $APP:${TAG}-tools
            
            # save for later steps
            echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Import this image in the test namespace and update the tag
        run: |
          oc -n $TEST_NS tag $TOOLS_NS/$APP:${IMAGE_TAG}-tools $TEST_NS/$APP:${IMAGE_TAG}-test

      - name: Update the deployment to use this new image
        run: |
          IMAGE=${REGISTRY}/${TEST_NS}/${APP}:${IMAGE_TAG}-test
          oc -n $TEST_NS set image deployment/$APP $APP=$IMAGE

      - name: Wait for deployment to complete
        run: |
          oc -n $TEST_NS rollout status deployment/$APP
