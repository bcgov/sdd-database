name: Deploy to dev namespace

on:
  push:
    branches: [ dev ]

env:
  TOOLS_NS: a6d989-tools
  DEV_NS:   a6d989-dev

  # BuildConfig and Deployment name
  APP:      employee-information-database

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: "latest"

      - name: oc login
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OC_SERVER }}
          openshift_token: ${{ secrets.OC_TOKEN }}    # SA token

      - name: Start OpenShift build in the tools namespace
        run: |
          # --wait flag tells the client to stream the build log and block until the build completes. It exits with a non-zero status if the build fails.
          oc start-build $APP --wait -n $TOOLS_NS

      - name: Add custom tag to the newly created image in the tools namespace
        run: |
          # dev-<first7charsOfCommit>
          TAG=dev-${GITHUB_SHA::7}
          
          # latest -> dev-<sha>-tools
          oc tag $APP:latest $APP:${TAG}-tools -n $TOOLS_NS
          
          # save for later steps
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Import this image in the dev namespace and update the tag
        run: |
          oc tag $TOOLS_NS/$APP:${IMAGE_TAG}-tools $DEV_NS/$APP:${IMAGE_TAG}-dev -n $DEV_NS
